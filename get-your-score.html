<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your AI Visibility Report — AIVI Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script id="fsc-api" src="https://sbl.onfastspring.com/sbl/1.0.6/fastspring-builder.min.js" type="text/javascript" data-storefront="aivilabs.test.onfastspring.com/popup-quickscan"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0d1425;--navy-mid:#131d35;--navy-light:#1a2640;--navy-border:#1f2e4a;--teal:#00c9a7;--teal-dim:rgba(0,201,167,0.12);--coral:#ff5f6d;--amber:#ffc542;--text:#e8edf7;--text-muted:#7a8fab;--text-dim:#4a5a74;--white:#ffffff}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;font-weight:300;background:var(--navy);color:var(--text);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px 48px;background:rgba(13,20,37,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.05)}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px;letter-spacing:-0.02em;color:var(--white);text-decoration:none}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--teal),#00a8d9);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;color:var(--navy)}
.logo .accent{color:var(--teal)}
.page{max-width:720px;margin:0 auto;padding:120px 32px 80px}
.score-hero{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;overflow:hidden;margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .1s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.score-top{padding:40px 44px;border-bottom:1px solid var(--navy-border);display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.score-circle{width:120px;height:120px;border-radius:50%;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.score-circle-num{font-family:'DM Serif Display',serif;font-size:42px;line-height:1}
.score-circle-denom{font-size:12px;color:var(--text-dim);font-weight:300;margin-top:2px}
.practice-name{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:var(--white);line-height:1.2;margin-bottom:10px;letter-spacing:-0.02em}
.label-badge{display:inline-block;padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:12px}
.score-message{font-size:14px;color:var(--text-muted);font-weight:300;line-height:1.65}
.city-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--navy-border)}
.city-stat{background:var(--navy-mid);padding:20px 24px;text-align:center}
.city-stat-num{font-family:'DM Serif Display',serif;font-size:28px;line-height:1;display:block;margin-bottom:4px}
.city-stat-label{font-size:12px;color:var(--text-muted);font-weight:300}
.comp-row.avg{border-top:1px solid var(--navy-border);opacity:.85}
.comp-row.avg .comp-name{color:var(--text-muted);font-style:italic;font-size:13px}
.bar.dashed{background:repeating-linear-gradient(90deg,#8a9bb8 0px,#8a9bb8 6px,transparent 6px,transparent 10px)}
.competitors{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;overflow:hidden;margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .25s}
.comp-head{padding:20px 28px;border-bottom:1px solid var(--navy-border);font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim)}
.comp-row{display:grid;grid-template-columns:1fr 200px 52px;gap:16px;align-items:center;padding:14px 28px;border-bottom:1px solid rgba(255,255,255,0.04)}
.comp-row:last-child{border-bottom:none}
.comp-row.you{border-left:2px solid var(--teal);padding-left:26px;background:rgba(0,201,167,0.03)}
.comp-name{font-size:14px;color:var(--text);font-weight:400}
.comp-name.you-label{color:var(--teal);font-weight:500}
.bar-wrap{height:4px;background:var(--navy);border-radius:2px;overflow:hidden}
.bar{height:100%;border-radius:2px;transition:width .8s ease}
.comp-score{font-size:14px;font-weight:500;text-align:right}
.copy-block{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;padding:36px 44px;margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .38s}
.copy-block h2{font-family:'DM Serif Display',serif;font-size:clamp(22px,3vw,30px);font-weight:400;line-height:1.2;color:var(--white);margin-bottom:16px;letter-spacing:-0.02em}
.copy-block p{font-size:15px;color:var(--text-muted);font-weight:300;line-height:1.8;margin-bottom:14px}
.copy-block p:last-child{margin-bottom:0}
.preview-section{margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .42s}
.preview-header{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;padding-left:4px}
.preview-row-top{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.preview-row-bottom{display:grid;grid-template-columns:1fr;gap:12px}
.preview-card{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:16px;overflow:hidden;transition:transform .2s}
.preview-card:hover{transform:translateY(-2px)}
.preview-card img{width:100%;height:auto;display:block;border-bottom:1px solid var(--navy-border)}
.preview-card-label{padding:14px 16px}
.preview-card-title{font-size:13px;font-weight:500;color:var(--white);margin-bottom:3px}
.preview-card-desc{font-size:11px;color:var(--text-dim);font-weight:300;line-height:1.4}
.preview-card-tag{display:inline-block;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin-top:6px}
.preview-card-tag.included{background:var(--teal-dim);color:var(--teal)}
.preview-card-tag.upgrade{background:rgba(255,197,66,0.12);color:var(--amber)}
.preview-card-wide{display:grid;grid-template-columns:auto 1fr;background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:16px;overflow:hidden;transition:transform .2s}
.preview-card-wide:hover{transform:translateY(-2px)}
.preview-card-wide img{width:280px;height:auto;display:block;border-right:1px solid var(--navy-border)}
.preview-card-wide .preview-card-label{padding:24px 28px;display:flex;flex-direction:column;justify-content:center}
.preview-card-wide .preview-card-title{font-size:16px;margin-bottom:6px}
.preview-card-wide .preview-card-desc{font-size:13px;line-height:1.55}
@media(max-width:600px){.preview-row-top{grid-template-columns:1fr 1fr;gap:10px}.preview-card-wide{grid-template-columns:1fr}.preview-card-wide img{width:100%;border-right:none;border-bottom:1px solid var(--navy-border)}}
.compare-section{margin-bottom:20px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .45s}
.compare-header{font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;padding-left:4px}
.compare-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare-card{background:var(--navy-mid);border:2px solid var(--navy-border);border-radius:20px;padding:28px 24px;cursor:pointer;transition:all .25s ease;position:relative}
.compare-card:hover{border-color:rgba(255,255,255,0.12)}
.compare-card.selected{border-color:var(--teal);background:linear-gradient(180deg,rgba(0,201,167,0.04) 0%,var(--navy-mid) 100%)}
.compare-badge{position:absolute;top:-10px;right:20px;padding:4px 12px;border-radius:100px;font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:var(--teal);color:var(--navy)}
.compare-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.compare-card-name{font-size:15px;font-weight:500;color:var(--white)}
.compare-card-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.compare-card.selected .compare-card-radio{border-color:var(--teal)}
.compare-card-radio-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);transform:scale(0);transition:transform .15s ease}
.compare-card.selected .compare-card-radio-dot{transform:scale(1)}
.compare-card-price{font-family:'DM Serif Display',serif;font-size:32px;color:var(--white);letter-spacing:-0.02em;margin-bottom:2px}
.compare-card-onetime{font-size:12px;color:var(--text-dim);font-weight:300;margin-bottom:20px}
.compare-card-divider{height:1px;background:var(--navy-border);margin-bottom:18px}
.compare-card-heading{font-size:11px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px}
.compare-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.compare-item:last-child{margin-bottom:0}
.compare-check{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.compare-item-text{font-size:13px;color:var(--text-muted);font-weight:300;line-height:1.45}
.compare-item-text strong{color:var(--text);font-weight:500}
.compare-insight{margin-top:18px;padding:14px 16px;background:rgba(0,201,167,0.05);border:1px solid rgba(0,201,167,0.12);border-radius:10px}
.compare-insight-text{font-size:12px;color:var(--text-muted);font-weight:300;line-height:1.55;font-style:italic}
.picker-section{margin-bottom:20px;overflow:hidden;max-height:0;opacity:0;transition:max-height .4s ease,opacity .3s ease}
.picker-section.open{max-height:800px;opacity:1}
.picker-card{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;padding:28px 28px 20px}
.picker-title{font-family:'DM Serif Display',serif;font-size:20px;font-weight:400;color:var(--white);margin-bottom:4px;letter-spacing:-0.02em}
.picker-subtitle{font-size:13px;color:var(--text-muted);font-weight:300;margin-bottom:16px;line-height:1.5}
.picker-counter{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:0.04em;background:var(--teal-dim);color:var(--teal);margin-bottom:16px;transition:all .2s}
.picker-counter.full{background:rgba(0,201,167,0.25)}
.picker-search{width:100%;padding:10px 14px;background:var(--navy);border:1px solid var(--navy-border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;outline:none;transition:border-color .2s;margin-bottom:12px}
.picker-search::placeholder{color:var(--text-dim)}
.picker-search:focus{border-color:rgba(255,255,255,0.15)}
.picker-list{max-height:320px;overflow-y:auto;border:1px solid var(--navy-border);border-radius:12px;background:var(--navy)}
.picker-list::-webkit-scrollbar{width:6px}
.picker-list::-webkit-scrollbar-track{background:transparent}
.picker-list::-webkit-scrollbar-thumb{background:var(--navy-border);border-radius:3px}
.picker-item{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.03);cursor:pointer;transition:background .15s}
.picker-item:last-child{border-bottom:none}
.picker-item:hover{background:rgba(255,255,255,0.02)}
.picker-item.checked{background:rgba(0,201,167,0.04)}
.picker-item.disabled{opacity:.35;cursor:default}
.picker-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.picker-item.checked .picker-cb{border-color:var(--teal);background:var(--teal)}
.picker-cb-tick{opacity:0;transition:opacity .15s;color:var(--navy);font-size:12px;font-weight:700;line-height:1}
.picker-item.checked .picker-cb-tick{opacity:1}
.picker-item-name{font-size:13px;color:var(--text);font-weight:400;line-height:1.3}
.picker-item-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;letter-spacing:0.03em;white-space:nowrap;margin-left:auto}
.picker-item-tag.ahead{background:rgba(255,95,109,0.12);color:var(--coral)}
.picker-item-tag.behind{background:rgba(0,201,167,0.10);color:var(--teal)}
.picker-item-score{font-size:12px;font-weight:500;padding:2px 8px;border-radius:100px;white-space:nowrap}
.picker-empty{padding:24px 14px;text-align:center;font-size:13px;color:var(--text-dim);font-weight:300}
.cta-block{background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;padding:36px 44px;opacity:0;transform:translateY(16px);animation:fadeUp .5s ease forwards .5s}
.btn-primary{display:block;width:100%;padding:16px 32px;border-radius:12px;font-size:16px;font-weight:500;background:var(--teal);color:var(--navy);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;text-align:center;text-decoration:none;margin-bottom:20px;letter-spacing:-0.01em}
.btn-primary:hover{background:#00e0bc;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:default;transform:none}
.btn-primary:disabled:hover{background:var(--teal);transform:none}
.what-you-get{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:1px solid var(--navy-border)}
.get-item{display:flex;align-items:flex-start;gap:12px}
.get-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:7px}
.get-text{font-size:14px;color:var(--text-muted);font-weight:300;line-height:1.5}
.get-text strong{color:var(--text);font-weight:500}
.reassurance{text-align:center;font-size:12px;color:var(--text-dim);font-weight:300;margin-top:16px;letter-spacing:0.01em}
.fallback{text-align:center;padding:80px 32px;opacity:0;animation:fadeUp .5s ease forwards .1s}
.fallback h1{font-family:'DM Serif Display',serif;font-size:36px;font-weight:400;color:var(--white);margin-bottom:16px;letter-spacing:-0.02em}
.fallback p{font-size:16px;color:var(--text-muted);font-weight:300;line-height:1.75;max-width:440px;margin:0 auto 32px}
.btn-ghost{display:inline-block;padding:13px 28px;border-radius:10px;font-size:15px;font-weight:400;background:transparent;color:var(--text-muted);border:1px solid var(--navy-border);text-decoration:none;transition:all .2s}
.btn-ghost:hover{border-color:rgba(255,255,255,0.2);color:var(--text)}
@media(max-width:600px){
  nav{padding:16px 24px}.page{padding:100px 20px 60px}.score-top{grid-template-columns:1fr;padding:28px 24px;gap:20px}.score-circle{margin:0 auto}.practice-name{font-size:19px}.comp-row{grid-template-columns:1fr 120px 44px;padding:12px 20px}.comp-row.you{padding-left:18px}.copy-block,.cta-block{padding:28px 24px}.city-stat{padding:16px 12px}.sticky-cta{display:none}.mobile-cta{display:flex}.compare-cards{grid-template-columns:1fr;gap:12px}.compare-card{padding:24px 20px}.compare-card-price{font-size:28px}.picker-card{padding:24px 20px 16px}
}
.layout{max-width:1100px;margin:0 auto;padding:120px 32px 80px;display:grid;grid-template-columns:1fr 280px;gap:32px;align-items:start}
.main-col{min-width:0}
.sticky-cta{position:sticky;top:100px;background:var(--navy-mid);border:1px solid var(--navy-border);border-radius:20px;padding:28px 24px;opacity:0;animation:fadeUp .5s ease forwards .6s}
.sticky-cta-price{font-family:'DM Serif Display',serif;font-size:32px;color:var(--white);text-align:center;margin-bottom:4px;letter-spacing:-0.02em}
.sticky-cta-label{font-size:12px;color:var(--text-dim);text-align:center;margin-bottom:20px;font-weight:300}
.sticky-cta .btn-primary{font-size:15px;padding:14px 20px;margin-bottom:16px}
.sticky-cta-items{display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--navy-border)}
.sticky-cta-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text-muted);font-weight:300;line-height:1.4}
.sticky-cta-dot{width:5px;height:5px;border-radius:50%;background:var(--teal);flex-shrink:0;margin-top:5px}
.sticky-reassurance{font-size:11px;color:var(--text-dim);text-align:center;margin-top:14px;font-weight:300;line-height:1.5}
.tier-selector{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tier-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--navy-border);background:transparent;cursor:pointer;transition:all .2s;position:relative;width:100%;text-align:left;font-family:'DM Sans',sans-serif;color:var(--text)}
.tier-option:hover{border-color:rgba(255,255,255,0.15)}
.tier-option.selected{border-color:var(--teal);background:rgba(0,201,167,0.06)}
.tier-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--text-dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.tier-option.selected .tier-radio{border-color:var(--teal)}
.tier-radio-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);transform:scale(0);transition:transform .15s ease}
.tier-option.selected .tier-radio-dot{transform:scale(1)}
.tier-info{flex:1;min-width:0}
.tier-name{font-size:13px;font-weight:500;line-height:1.3}
.tier-price-tag{font-size:12px;color:var(--text-muted);font-weight:300}
.tier-badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;background:rgba(0,201,167,0.15);color:var(--teal);white-space:nowrap}
.mobile-cta{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(13,20,37,0.97);backdrop-filter:blur(12px);border-top:1px solid var(--navy-border);padding:16px 20px;z-index:99;align-items:center;gap:16px}
.mobile-cta-text{flex:1;font-size:13px;color:var(--text-muted);font-weight:300;line-height:1.3}
.mobile-cta-text strong{color:var(--white);font-weight:500;display:block;font-size:14px}
.mobile-cta .btn-primary{flex-shrink:0;width:auto;padding:12px 20px;font-size:14px;margin-bottom:0;white-space:nowrap}
@media(min-width:601px){.mobile-cta{display:none!important}.page{display:none}}
@media(max-width:600px){.layout{display:none}.page{display:block;padding-bottom:100px}}
.lightbox{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);align-items:center;justify-content:center;cursor:zoom-out;padding:40px}
.lightbox.open{display:flex}
.lightbox img{max-width:90%;max-height:90vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.lightbox-close{position:absolute;top:20px;right:24px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lightbox-close:hover{background:rgba(255,255,255,0.2)}
.preview-card img,.preview-card-wide img{cursor:zoom-in}
</style>
</head>
<body>
<nav><a href="https://aivilabs.io" class="logo"><div class="logo-mark">AI</div>AIVI <span class="accent">Labs</span></a></nav>
<div class="page" id="page-content-mobile"></div>
<div class="layout">
  <div class="main-col" id="page-content"></div>
  <div class="sticky-cta" id="sticky-cta" style="display:none;">
    <div class="tier-selector">
      <button class="tier-option selected" data-tier="score" onclick="selectTier('score')"><div class="tier-radio"><div class="tier-radio-dot"></div></div><div class="tier-info"><div class="tier-name">Your Score</div><div class="tier-price-tag">$149</div></div></button>
      <button class="tier-option" data-tier="competitive" onclick="selectTier('competitive')"><div class="tier-radio"><div class="tier-radio-dot"></div></div><div class="tier-info"><div class="tier-name">+ Competitive Report</div><div class="tier-price-tag">$299</div></div><div class="tier-badge">Best value</div></button>
    </div>
    <div class="sticky-cta-price" id="sticky-price">$149</div>
    <div class="sticky-cta-label">One-time payment</div>
    <button class="btn-primary" id="sticky-btn" onclick="document.querySelector('.cta-block .btn-primary').click()">Get your full report</button>
    <div class="sticky-cta-items" id="sticky-items">
      <div class="sticky-cta-item"><div class="sticky-cta-dot"></div>Full 12-point AI audit</div>
      <div class="sticky-cta-item"><div class="sticky-cta-dot"></div>PDF scorecard + city ranking</div>
      <div class="sticky-cta-item"><div class="sticky-cta-dot"></div>Ready-to-use fix packs</div>
      <div class="sticky-cta-item"><div class="sticky-cta-dot"></div>Delivered within 24 hours</div>

let selectedCompetitors=[];

function getCityPractices(city){
  const target=city.split(',')[0].trim();
  const buyerName=getParams().practice.toLowerCase().trim();
  return Object.entries(PRACTICE_DB).filter(([d,p])=>p.city===target&&p.score>0).filter(([d,p])=>p.name.toLowerCase().trim()!==buyerName).map(([d,p])=>({domain:d,name:p.name,score:p.score})).sort((a,b)=>a.name.localeCompare(b.name));
}

function toggleCompetitor(domain,name,score){
  const idx=selectedCompetitors.findIndex(c=>c.domain===domain);
  if(idx>=0)selectedCompetitors.splice(idx,1);
  else if(selectedCompetitors.length<3)selectedCompetitors.push({domain,name,score});
  refreshPicker();updateCtaState();
}

function refreshPicker(){
  document.querySelectorAll('.picker-section').forEach(section=>{
    const search=section.querySelector('.picker-search');
    const filter=search?search.value.toLowerCase():'';
    const list=section.querySelector('.picker-list');
    const counter=section.querySelector('.picker-counter');
    const practices=getCityPractices(getParams().city);
    if(counter){counter.textContent=selectedCompetitors.length+' of 3 selected';counter.classList.toggle('full',selectedCompetitors.length>=3)}
    const filtered=practices.filter(p=>p.name.toLowerCase().includes(filter));
    if(!filtered.length){list.innerHTML='<div class="picker-empty">No practices match your search</div>';return}
    list.innerHTML=filtered.map(p=>{
      const isChecked=selectedCompetitors.some(c=>c.domain===p.domain);
      const isDisabled=!isChecked&&selectedCompetitors.length>=3;
      const cls=(isChecked?' checked':'')+(isDisabled?' disabled':'');
      const escapedName=p.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');
      const buyerScore=getParams().score||0;
      const tag=p.score>buyerScore?'<div class="picker-item-tag ahead">Ahead of you</div>':p.score<buyerScore?'<div class="picker-item-tag behind">Behind you</div>':'';
      return'<div class="picker-item'+cls+'" onclick="'+(isDisabled?'':"toggleCompetitor('"+p.domain+"','"+escapedName+"',"+p.score+")")+'">'+'<div class="picker-cb"><span class="picker-cb-tick">\u2713</span></div>'+'<div class="picker-item-name">'+esc(p.name)+'</div>'+tag+'</div>';
    }).join('');
  });
}

function updateCtaState(){
  if(currentTier==='competitive'&&selectedCompetitors.length<3){
    const remaining=3-selectedCompetitors.length;
    const label=selectedCompetitors.length===0?'Select 3 competitors above':'Select '+remaining+' more competitor'+(remaining>1?'s':'');
    document.querySelectorAll('.cta-block .btn-primary').forEach(btn=>{btn.disabled=true;btn.textContent=label});
    const sb=document.getElementById('sticky-btn');if(sb){sb.disabled=true;sb.textContent=selectedCompetitors.length+'/3 selected'}
    const mb=document.getElementById('mobile-cta-btn');if(mb)mb.disabled=true;
  }else{
    const t=TIERS[currentTier];
    document.querySelectorAll('.cta-block .btn-primary').forEach(btn=>{btn.disabled=false;btn.textContent=t.btnTextInline});
    const sb=document.getElementById('sticky-btn');if(sb){sb.disabled=false;sb.textContent=t.btnText}
    const mb=document.getElementById('mobile-cta-btn');if(mb)mb.disabled=false;
  }
}

  const sp=document.getElementById('sticky-price'),si=document.getElementById('sticky-items');
  if(sp)sp.textContent=t.price;
  if(si)si.innerHTML=t.items.map(i=>'<div class="sticky-cta-item"><div class="sticky-cta-dot"></div>'+i+'</div>').join('');
  document.querySelectorAll('.cta-block .btn-primary').forEach(btn=>btn.setAttribute('data-fsc-item-path-value',t.product));
  document.querySelectorAll('.cta-block .what-you-get').forEach(c=>{c.innerHTML=t.inlineItems.map(i=>'<div class="get-item"><div class="get-dot"></div><div class="get-text"><strong>'+i.bold+'</strong>'+i.rest+'</div></div>').join('')});
  const ml=document.getElementById('mobile-cta-label'),ms=document.getElementById('mobile-cta-sub');
  if(ml)ml.textContent=t.btnText;if(ms)ms.textContent=t.mobileSub;
  updateCtaState();refreshPicker();
}

render();
</script>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" alt="Report preview">
</div>

<script>
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});
document.addEventListener('click',function(e){
  if(e.target.matches('.preview-card img, .preview-card-wide img')){
    e.preventDefault();openLightbox(e.target.src);
  }
});
</script>
</body>
</html>
