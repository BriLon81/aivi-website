<section id="findings">
<div style="max-width: 1200px; margin: 0 auto; padding: 64px 24px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between">
<div class="f-420">
<h2 class="h2-28">New findings by email</h2>
<p style="margin: 10px 0 0; font-size: 17px; line-height: 1.6; color: #3D4658">Only when a study turns up something new.</p>
</div>
<form id="findings-form" novalidate class="f-420 cols gap-12" style="align-items: flex-end">
<div class="f-240 field">
<label for="email" class="label">Email address</label>
<input id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" class="input">
</div>
<button type="submit" class="btn-submit btn-submit--s">Send me findings</button>
<div class="hp" aria-hidden="true">
<label for="findings-website">Website</label>
<input id="findings-website" name="website" type="text" tabindex="-1" autocomplete="off">
</div>
<p id="findings-consent" class="form-hint form-row">We'll email you when a study finds something new. Unsubscribe any time.</p>
<p class="form-error form-row" role="alert"></p>
</form>
</div>
</section>
